<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Tanishq Bhosale - Backend and AI Systems Engineer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04050A"/>
      <stop offset="55%" stop-color="#070A16"/>
      <stop offset="100%" stop-color="#0A0620"/>
    </linearGradient>

    <radialGradient id="horizonGlow" cx="50%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#00E5FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="card"><rect x="0" y="0" width="1200" height="340" rx="16"/></clipPath>
    <clipPath id="floor"><rect x="0" y="196" width="1200" height="144"/></clipPath>
    <clipPath id="typeMask"><rect x="66" y="196" width="0" height="40">
      <animate attributeName="width" values="0;0;520" keyTimes="0;0.22;0.72" dur="6s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#sky)"/>
    <rect width="1200" height="340" fill="url(#horizonGlow)"/>

    <!-- starfield -->
    <g fill="#9FE9FF">
      <circle cx="140" cy="46" r="1.2" opacity="0.7"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="410" cy="30" r="1" opacity="0.5"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="58" r="1.4" opacity="0.6"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="36" r="1" opacity="0.5"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="96" r="1.1" opacity="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="86" r="0.9" opacity="0.4"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- perspective floor -->
    <g clip-path="url(#floor)">
      <line x1="0" y1="196" x2="1200" y2="196" stroke="url(#lineFade)" stroke-width="1.4" opacity="0.85"/>

      <g stroke="#00E5FF" stroke-width="1" opacity="0.55">
        <line x1="600" y1="196" x2="-560" y2="342"/>
        <line x1="600" y1="196" x2="-220" y2="342"/>
        <line x1="600" y1="196" x2="60" y2="342"/>
        <line x1="600" y1="196" x2="290" y2="342"/>
        <line x1="600" y1="196" x2="470" y2="342"/>
        <line x1="600" y1="196" x2="600" y2="342"/>
        <line x1="600" y1="196" x2="730" y2="342"/>
        <line x1="600" y1="196" x2="910" y2="342"/>
        <line x1="600" y1="196" x2="1140" y2="342"/>
        <line x1="600" y1="196" x2="1420" y2="342"/>
        <line x1="600" y1="196" x2="1760" y2="342"/>
      </g>

      <g stroke="#7C3AED" stroke-width="1.2">
        <line x1="0" x2="1200" y1="200" y2="200" opacity="0">
          <animate attributeName="y1" values="198;342" dur="3.2s" repeatCount="indefinite" keyTimes="0;1" calcMode="spline" keySplines="0.5 0 1 1" begin="0s"/>
          <animate attributeName="y2" values="198;342" dur="3.2s" repeatCount="indefinite" keyTimes="0;1" calcMode="spline" keySplines="0.5 0 1 1" begin="0s"/>
          <animate attributeName="opacity" values="0;0.75;0" dur="3.2s" repeatCount="indefinite" begin="0s"/>
        </line>
        <line x1="0" x2="1200" y1="200" y2="200" opacity="0">
          <animate attributeName="y1" values="198;342" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 1 1" begin="0.53s"/>
          <animate attributeName="y2" values="198;342" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 1 1" begin="0.53s"/>
          <animate attributeName="opacity" values="0;0.75;0" dur="3.2s" repeatCount="indefinite" begin="0.53s"/>
        </line>
        <line x1="0" x2="1200" y1="200" y2="200" opacity="0">
          <animate attributeName="y1" values="198;342" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 1 1" begin="1.06s"/>
          <animate attributeName="y2" values="198;342" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 1 1" begin="1.06s"/>
          <animate attributeName="opacity" values="0;0.75;0" dur="3.2s" repeatCount="indefinite" begin="1.06s"/>
        </line>
        <line x1="0" x2="1200" y1="200" y2="200" opacity="0">
          <animate attributeName="y1" values="198;342" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 1 1" begin="1.6s"/>
          <animate attributeName="y2" values="198;342" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 1 1" begin="1.6s"/>
          <animate attributeName="opacity" values="0;0.75;0" dur="3.2s" repeatCount="indefinite" begin="1.6s"/>
        </line>
        <line x1="0" x2="1200" y1="200" y2="200" opacity="0">
          <animate attributeName="y1" values="198;342" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 1 1" begin="2.13s"/>
          <animate attributeName="y2" values="198;342" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 1 1" begin="2.13s"/>
          <animate attributeName="opacity" values="0;0.75;0" dur="3.2s" repeatCount="indefinite" begin="2.13s"/>
        </line>
        <line x1="0" x2="1200" y1="200" y2="200" opacity="0">
          <animate attributeName="y1" values="198;342" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 1 1" begin="2.66s"/>
          <animate attributeName="y2" values="198;342" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 1 1" begin="2.66s"/>
          <animate attributeName="opacity" values="0;0.75;0" dur="3.2s" repeatCount="indefinite" begin="2.66s"/>
        </line>
      </g>
    </g>

    <!-- glitch title -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">
      <text x="66" y="132" font-size="58" letter-spacing="3" fill="#FF2E97" opacity="0.75" filter="url(#softGlow)">
        TANISHQ BHOSALE
        <animate attributeName="dx" values="0;-5;2;0;0;0;-3;0" dur="5s" repeatCount="indefinite" calcMode="discrete"/>
      </text>
      <text x="66" y="132" font-size="58" letter-spacing="3" fill="#00E5FF" opacity="0.75" filter="url(#softGlow)">
        TANISHQ BHOSALE
        <animate attributeName="dx" values="0;5;-2;0;0;0;3;0" dur="5s" repeatCount="indefinite" calcMode="discrete"/>
      </text>
      <text x="66" y="132" font-size="58" letter-spacing="3" fill="#EAF7FF" filter="url(#glow)">TANISHQ BHOSALE</text>

      <!-- typed subtitle -->
      <g clip-path="url(#typeMask)">
        <text x="66" y="226" font-size="21" font-weight="500" fill="#8FE9FF" letter-spacing="1">
          &gt; backend systems &#183; ai agents &#183; low-latency apis
        </text>
      </g>
      <rect y="207" width="10" height="22" fill="#00E5FF">
        <animate attributeName="x" values="70;70;592" keyTimes="0;0.22;0.72" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1;0;1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- right-side telemetry -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6FD9F5" opacity="0.9">
      <text x="1134" y="46" text-anchor="end" letter-spacing="2">SYS // ONLINE</text>
      <circle cx="1152" cy="42" r="4" fill="#22F5A8">
        <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="1156" y="72" text-anchor="end" fill="#5B7FA8">uptime .......... 99.9%</text>
      <text x="1156" y="92" text-anchor="end" fill="#5B7FA8">p95 latency ..... 118ms</text>
      <text x="1156" y="112" text-anchor="end" fill="#5B7FA8">region .......... BLR-1</text>
    </g>

    <!-- status chips -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1">
      <g transform="translate(66,262)">
        <rect width="196" height="30" rx="15" fill="#0B1626" stroke="#00E5FF" stroke-opacity="0.45"/>
        <circle cx="18" cy="15" r="4" fill="#00E5FF"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
        <text x="32" y="19" fill="#BFEFFF">BANGALORE &#183; INDIA</text>
      </g>
      <g transform="translate(276,262)">
        <rect width="186" height="30" rx="15" fill="#0B1626" stroke="#7C3AED" stroke-opacity="0.55"/>
        <circle cx="18" cy="15" r="4" fill="#B48CFF"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
        <text x="32" y="19" fill="#D9C9FF">2+ YRS SHIPPING</text>
      </g>
      <g transform="translate(476,262)">
        <rect width="212" height="30" rx="15" fill="#0B1626" stroke="#22F5A8" stroke-opacity="0.5"/>
        <circle cx="18" cy="15" r="4" fill="#22F5A8"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
        <text x="32" y="19" fill="#B6FFE4">OPEN TO COLLABORATE</text>
      </g>
    </g>

    <!-- scanline sweep -->
    <rect x="0" width="1200" height="90" fill="url(#scan)">
      <animate attributeName="y" values="-90;340" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <!-- corner brackets -->
    <g stroke="#00E5FF" stroke-width="2" fill="none" opacity="0.8">
      <path d="M18 52 L18 18 L52 18"/>
      <path d="M1182 52 L1182 18 L1148 18"/>
      <path d="M18 288 L18 322 L52 322"/>
      <path d="M1182 288 L1182 322 L1148 322"/>
    </g>
    <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="16" fill="none" stroke="#1B2A44"/>
  </g>
</svg>
