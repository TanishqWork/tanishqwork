<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Capability matrix: agentic orchestration, token streaming, vector memory, async services, query optimisation, full-stack delivery">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060B"/>
      <stop offset="100%" stop-color="#090616"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101B2E"/>
      <stop offset="100%" stop-color="#080F1C"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="g3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card3"><rect width="1200" height="220" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#card3)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="1200" height="220" fill="url(#bg3)"/>

    <text x="32" y="36" font-size="12" letter-spacing="3" fill="#4E7BA8">CAPABILITY MATRIX &#183; VERIFIED IN PRODUCTION</text>
    <circle cx="1160" cy="32" r="4" fill="#22F5A8"><animate attributeName="opacity" values="1;0.15;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <text x="1146" y="36" text-anchor="end" font-size="11" fill="#4E7BA8">ALL SYSTEMS NOMINAL</text>

    <!-- tile 1 -->
    <g transform="translate(32,60)">
      <path d="M0 0 H172 L188 16 V124 H16 L0 108 Z" fill="url(#tile)" stroke="#1E3350"/>
      <path d="M0 0 H172 L188 16 V124 H16 L0 108 Z" fill="none" stroke="#00E5FF">
        <animate attributeName="stroke-opacity" values="0;0.85;0" dur="4.2s" repeatCount="indefinite" begin="0s"/>
      </path>
      <g stroke="#00E5FF" stroke-width="1.6" fill="none" transform="translate(20,22)">
        <circle cx="10" cy="10" r="4"/><circle cx="34" cy="4" r="3"/><circle cx="34" cy="20" r="3"/>
        <path d="M14 9 L31 5 M14 12 L31 19"/>
      </g>
      <text x="20" y="82" font-size="14" font-weight="700" fill="#EAF7FF">AGENTIC</text>
      <text x="20" y="102" font-size="11" fill="#5B87B5">LangGraph state graphs</text>
    </g>

    <!-- tile 2 -->
    <g transform="translate(224,60)">
      <path d="M0 0 H172 L188 16 V124 H16 L0 108 Z" fill="url(#tile)" stroke="#1E3350"/>
      <path d="M0 0 H172 L188 16 V124 H16 L0 108 Z" fill="none" stroke="#00E5FF">
        <animate attributeName="stroke-opacity" values="0;0.85;0" dur="4.2s" repeatCount="indefinite" begin="0.6s"/>
      </path>
      <g stroke="#22F5A8" stroke-width="1.8" fill="none" transform="translate(20,22)">
        <path d="M0 12 L6 12 L10 3 L16 21 L21 8 L26 15 L32 15 L40 15"/>
      </g>
      <text x="20" y="82" font-size="14" font-weight="700" fill="#EAF7FF">STREAMING</text>
      <text x="20" y="102" font-size="11" fill="#5B87B5">SSE, token-level</text>
    </g>

    <!-- tile 3 -->
    <g transform="translate(416,60)">
      <path d="M0 0 H172 L188 16 V124 H16 L0 108 Z" fill="url(#tile)" stroke="#1E3350"/>
      <path d="M0 0 H172 L188 16 V124 H16 L0 108 Z" fill="none" stroke="#00E5FF">
        <animate attributeName="stroke-opacity" values="0;0.85;0" dur="4.2s" repeatCount="indefinite" begin="1.2s"/>
      </path>
      <g stroke="#B48CFF" stroke-width="1.6" fill="none" transform="translate(22,20)">
        <ellipse cx="16" cy="5" rx="14" ry="4.5"/>
        <path d="M2 5 V19 A14 4.5 0 0 0 30 19 V5"/>
        <path d="M2 12 A14 4.5 0 0 0 30 12"/>
      </g>
      <text x="20" y="82" font-size="14" font-weight="700" fill="#EAF7FF">MEMORY</text>
      <text x="20" y="102" font-size="11" fill="#5B87B5">pgvector &#183; Mem0</text>
    </g>

    <!-- tile 4 -->
    <g transform="translate(608,60)">
      <path d="M0 0 H172 L188 16 V124 H16 L0 108 Z" fill="url(#tile)" stroke="#1E3350"/>
      <path d="M0 0 H172 L188 16 V124 H16 L0 108 Z" fill="none" stroke="#00E5FF">
        <animate attributeName="stroke-opacity" values="0;0.85;0" dur="4.2s" repeatCount="indefinite" begin="1.8s"/>
      </path>
      <g stroke="#00E5FF" stroke-width="1.6" fill="none" transform="translate(20,20)">
        <rect x="0" y="0" width="14" height="10" rx="2"/>
        <rect x="24" y="0" width="14" height="10" rx="2"/>
        <rect x="12" y="18" width="14" height="10" rx="2"/>
        <path d="M7 10 L19 18 M31 10 L19 18"/>
      </g>
      <text x="20" y="82" font-size="14" font-weight="700" fill="#EAF7FF">ASYNC</text>
      <text x="20" y="102" font-size="11" fill="#5B87B5">FastAPI microservices</text>
    </g>

    <!-- tile 5 -->
    <g transform="translate(800,60)">
      <path d="M0 0 H172 L188 16 V124 H16 L0 108 Z" fill="url(#tile)" stroke="#1E3350"/>
      <path d="M0 0 H172 L188 16 V124 H16 L0 108 Z" fill="none" stroke="#00E5FF">
        <animate attributeName="stroke-opacity" values="0;0.85;0" dur="4.2s" repeatCount="indefinite" begin="2.4s"/>
      </path>
      <g fill="#FF2E97" transform="translate(20,18)">
        <rect x="0" y="18" width="7" height="12" rx="1.5"/>
        <rect x="11" y="10" width="7" height="20" rx="1.5"/>
        <rect x="22" y="2" width="7" height="28" rx="1.5" opacity="0.75"/>
      </g>
      <text x="20" y="82" font-size="14" font-weight="700" fill="#EAF7FF">QUERY TUNING</text>
      <text x="20" y="102" font-size="11" fill="#5B87B5">indexes &#183; plan rewrites</text>
    </g>

    <!-- tile 6 -->
    <g transform="translate(992,60)">
      <path d="M0 0 H172 L188 16 V124 H16 L0 108 Z" fill="url(#tile)" stroke="#1E3350"/>
      <path d="M0 0 H172 L188 16 V124 H16 L0 108 Z" fill="none" stroke="#00E5FF">
        <animate attributeName="stroke-opacity" values="0;0.85;0" dur="4.2s" repeatCount="indefinite" begin="3s"/>
      </path>
      <g stroke="#22F5A8" stroke-width="1.6" fill="none" transform="translate(20,20)">
        <path d="M18 0 L36 8 L18 16 L0 8 Z"/>
        <path d="M0 16 L18 24 L36 16"/>
      </g>
      <text x="20" y="82" font-size="14" font-weight="700" fill="#EAF7FF">FULL-STACK</text>
      <text x="20" y="102" font-size="11" fill="#5B87B5">React &#8594; Postgres</text>
    </g>

    <!-- sweeping highlight -->
    <rect y="0" width="220" height="220" fill="url(#sweep)">
      <animate attributeName="x" values="-220;1200" dur="6s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.75" y="0.75" width="1198.5" height="218.5" rx="16" fill="none" stroke="#1B2A44"/>
  </g>
</svg>
