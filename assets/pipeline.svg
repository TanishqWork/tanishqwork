<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Agentic AI request pipeline: client to FastAPI to LangGraph agent to tools and vector memory, streamed back over SSE">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070E"/>
      <stop offset="100%" stop-color="#0A0718"/>
    </linearGradient>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101B2E"/>
      <stop offset="100%" stop-color="#0A1220"/>
    </linearGradient>
    <filter id="g2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card2"><rect width="1200" height="280" rx="16"/></clipPath>

    <path id="p1" d="M186 104 H272"/>
    <path id="p2" d="M430 104 H516"/>
    <path id="p3" d="M674 104 H760"/>
    <path id="p4" d="M918 104 H1004"/>
    <path id="pBack" d="M1062 150 V214 H144 V150"/>
  </defs>

  <g clip-path="url(#card2)">
    <rect width="1200" height="280" fill="url(#bg2)"/>

    <!-- faint dot grid -->
    <g fill="#1C2C48">
      <circle cx="40" cy="40" r="1"/><circle cx="120" cy="40" r="1"/><circle cx="200" cy="40" r="1"/>
      <circle cx="280" cy="40" r="1"/><circle cx="360" cy="40" r="1"/><circle cx="440" cy="40" r="1"/>
      <circle cx="520" cy="40" r="1"/><circle cx="600" cy="40" r="1"/><circle cx="680" cy="40" r="1"/>
      <circle cx="760" cy="40" r="1"/><circle cx="840" cy="40" r="1"/><circle cx="920" cy="40" r="1"/>
      <circle cx="1000" cy="40" r="1"/><circle cx="1080" cy="40" r="1"/><circle cx="1160" cy="40" r="1"/>
      <circle cx="40" cy="248" r="1"/><circle cx="200" cy="248" r="1"/><circle cx="360" cy="248" r="1"/>
      <circle cx="520" cy="248" r="1"/><circle cx="680" cy="248" r="1"/><circle cx="840" cy="248" r="1"/>
      <circle cx="1000" cy="248" r="1"/><circle cx="1160" cy="248" r="1"/>
    </g>

    <text x="32" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3" fill="#4E7BA8">RUNTIME TOPOLOGY &#183; AGENTIC INFERENCE PATH</text>

    <!-- connectors -->
    <g stroke="#20456E" stroke-width="1.6" fill="none">
      <use href="#p1"/><use href="#p2"/><use href="#p3"/><use href="#p4"/>
      <path d="M1062 150 V214 H144 V150" stroke="#3B2A6B" stroke-dasharray="6 6"/>
    </g>

    <!-- flowing packets -->
    <g fill="#00E5FF" filter="url(#g2)">
      <circle r="4"><animateMotion dur="1.1s" repeatCount="indefinite" begin="0s"><mpath href="#p1"/></animateMotion></circle>
      <circle r="4"><animateMotion dur="1.1s" repeatCount="indefinite" begin="0.9s"><mpath href="#p2"/></animateMotion></circle>
      <circle r="4"><animateMotion dur="1.1s" repeatCount="indefinite" begin="1.8s"><mpath href="#p3"/></animateMotion></circle>
      <circle r="4"><animateMotion dur="1.1s" repeatCount="indefinite" begin="2.7s"><mpath href="#p4"/></animateMotion></circle>
    </g>
    <g fill="#B48CFF" filter="url(#g2)">
      <circle r="3.4"><animateMotion dur="2.4s" repeatCount="indefinite" begin="3.4s"><mpath href="#pBack"/></animateMotion></circle>
      <circle r="3.4"><animateMotion dur="2.4s" repeatCount="indefinite" begin="4.0s"><mpath href="#pBack"/></animateMotion></circle>
      <circle r="3.4"><animateMotion dur="2.4s" repeatCount="indefinite" begin="4.6s"><mpath href="#pBack"/></animateMotion></circle>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <!-- node 1 -->
      <g transform="translate(32,68)">
        <rect width="154" height="72" rx="10" fill="url(#nodeFill)" stroke="#00E5FF" stroke-opacity="0.5"/>
        <text x="16" y="28" font-size="13" fill="#EAF7FF" font-weight="700">CLIENT</text>
        <text x="16" y="50" font-size="11" fill="#5B87B5">React &#183; Expo</text>
        <circle cx="138" cy="16" r="3.5" fill="#22F5A8"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
      </g>

      <!-- node 2 -->
      <g transform="translate(272,68)">
        <rect width="158" height="72" rx="10" fill="url(#nodeFill)" stroke="#00E5FF" stroke-opacity="0.5"/>
        <text x="16" y="28" font-size="13" fill="#EAF7FF" font-weight="700">FASTAPI</text>
        <text x="16" y="50" font-size="11" fill="#5B87B5">async &#183; rate-limited</text>
        <circle cx="142" cy="16" r="3.5" fill="#22F5A8"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></circle>
      </g>

      <!-- node 3 -->
      <g transform="translate(516,60)">
        <rect width="158" height="88" rx="10" fill="url(#nodeFill)" stroke="#7C3AED" stroke-opacity="0.7"/>
        <text x="16" y="30" font-size="13" fill="#EAF7FF" font-weight="700">LANGGRAPH</text>
        <text x="16" y="52" font-size="11" fill="#8E6BD4">state machine</text>
        <text x="16" y="70" font-size="11" fill="#5B87B5">8 domain tools</text>
        <rect x="0" y="0" width="158" height="88" rx="10" fill="none" stroke="#B48CFF" stroke-opacity="0.9">
          <animate attributeName="stroke-opacity" values="0;0.9;0" dur="2.2s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- node 4 -->
      <g transform="translate(760,68)">
        <rect width="158" height="72" rx="10" fill="url(#nodeFill)" stroke="#00E5FF" stroke-opacity="0.5"/>
        <text x="16" y="28" font-size="13" fill="#EAF7FF" font-weight="700">PGVECTOR</text>
        <text x="16" y="50" font-size="11" fill="#5B87B5">Mem0 &#183; parallel load</text>
      </g>

      <!-- node 5 -->
      <g transform="translate(1004,68)">
        <rect width="164" height="72" rx="10" fill="url(#nodeFill)" stroke="#22F5A8" stroke-opacity="0.55"/>
        <text x="16" y="28" font-size="13" fill="#EAF7FF" font-weight="700">SSE STREAM</text>
        <text x="16" y="50" font-size="11" fill="#4FBF97">token-by-token</text>
      </g>

      <!-- metrics strip -->
      <g font-size="11" fill="#4E7BA8">
        <text x="32" y="252">&#8594; first-token latency <tspan fill="#22F5A8">-40%</tspan></text>
        <text x="300" y="252">&#8594; api response time <tspan fill="#22F5A8">-35%</tspan></text>
        <text x="566" y="252">&#8594; tokens / request <tspan fill="#22F5A8">-30%</tspan></text>
        <text x="828" y="252">&#8594; conversion events tracked <tspan fill="#00E5FF">10+</tspan></text>
      </g>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="278.5" rx="16" fill="none" stroke="#1B2A44"/>
  </g>
</svg>
